{% extends 'base.html' %}{% block content %}<h1>Usuários e permissões</h1><section class="card"><h2>Criar usuário</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Nome<input name="name" required></label><label>E-mail<input name="email" type="email" required></label><label>Senha (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required></label><label>Perfil<select name="role"><option value="staff">Funcionário</option><option value="admin">Administrador</option></select></label><button>Criar usuário</button></form></section><section class="card"><h2>Usuários cadastrados</h2><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Comissão geral</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td><form method="post" action="{{url_for('user_rate',uid=u.id)}}" class="rowform"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="number" name="rate" min="0" max="100" step="0.01" value="{{u.commission_rate}}"><button>Salvar</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
